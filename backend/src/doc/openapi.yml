openapi: 3.0.3
info:
  title: API Documentation
  version: 1.0.0
  description: |
    Documentation des routes de ton backend Express.
    ⚙️ Toutes les routes renvoient actuellement un statut `200 OK`.
servers:
  - url: /
    description: Serveur local de développement

paths:
  # --- AUTH ---
  /auth/login:
    post:
      summary: Authentification d’un utilisateur
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: L'adresse e-mail de l'utilisateur
                  example: user@example.com
                password:
                  type: string
                  description: Le mot de passe de l'utilisateur
                  example: MySuperSecretPassword123!
              required:
                - email
                - password
      responses:
        "200":
          description: Succès de la connexion
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Welcome !
                  success:
                    type: boolean
                    example: true
        "400":
          description: Erreur de validation (email ou mot de passe manquant)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: No email provided
                  success:
                    type: boolean
                    example: false
        "401":
          description: Identifiants invalides
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid credentials
                  success:
                    type: boolean
                    example: false

  /auth/register:
    post:
      summary: Inscription d’un utilisateur
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  description: Nom d'utilisateur unique
                  example: myusername
                email:
                  type: string
                  format: email
                  description: L'adresse e-mail de l'utilisateur
                  example: user@example.com
                password:
                  type: string
                  minLength: 6
                  maxLength: 100
                  description: Le mot de passe de l'utilisateur
                  example: MySuperSecretPassword123!
              required:
                - username
                - email
                - password
      responses:
        "200":
          description: Succès de l'inscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Welcome !
                  success:
                    type: boolean
                    example: true
        "400":
          description: Erreur de validation (champs manquants ou invalides)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: No username provided
                  success:
                    type: boolean
                    example: false
        "409":
          description: Conflit (email ou nom d'utilisateur déjà existant)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account already existing, try to login !
                  success:
                    type: boolean
                    example: false

  /auth/session:
    get:
      summary: Vérifie la session de l’utilisateur courant
      tags: [Auth]
      responses:
        "200":
          description: Succès (session active)
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      summary: Déconnecte l'utilisateur
      tags: [Auth]
      responses:
        "200":
          description: Succès de la déconnexion
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /auth/account:
    delete:
      summary: Supprime le compte utilisateur
      tags: [Auth]
      responses:
        "200":
          description: Succès de la suppression du compte
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  # --- EXPLORER ---
  /explorer:
    get:
      summary: Récupère la liste des éléments explorables
      tags: [Explorer]
      responses:
        "200":
          description: Succès

  /explorer/pages_number:
    get:
      summary: Récupère le nombre total de pages
      tags: [Explorer]
      responses:
        "200":
          description: Succès

  /explorer/comments/{id}:
    get:
      summary: Récupère les commentaires associés à un élément
      tags: [Explorer]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Identifiant unique de l’élément
      responses:
        "200":
          description: Succès

  # --- CODE ---
  /code:
    post: # Cette définition est pour l'exécution de code via Piston
      summary: Exécute un snippet de code via l'API Piston
      description: Permet d'exécuter du code dans différents langages de programmation en utilisant l'API Piston (emkc.org). Nécessite une authentification.
      tags: [Code]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - language
                - content
                - version
              properties:
                language:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: Nom du langage de programmation
                  example: "python"
                content:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: Code source à exécuter
                  example: "print('Hello World')"
                version:
                  type: string
                  pattern: '^\d+(\.\d+)*$'
                  description: Version du langage (format X.Y.Z)
                  example: "3.10.0"
      responses:
        "200":
          description: Code exécuté avec succès
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PistonResponse"
                  - $ref: "#/components/schemas/ServerResponse"
              examples:
                success:
                  summary: Exécution réussie
                  value:
                    language: "python"
                    version: "3.10.0"
                    run:
                      stdout: "Hello World\n"
                      stderr: ""
                      code: 0
                      signal: null
                      output: "Hello World\n"
                apiError:
                  summary: Erreur API Piston
                  value:
                    success: false
                    message: "An error occured while sending data to the code runner api"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerResponse"
              examples:
                emptyCode:
                  summary: Code vide
                  value:
                    success: false
                    message: "Le code ne peut pas être vide"
                codeTooLong:
                  summary: Code trop long
                  value:
                    success: false
                    message: "Le code ne peut excéder 10 000 caractères"
                invalidLanguage:
                  summary: Langage invalide
                  value:
                    success: false
                    message: "Le nom du langage ne peut pas être vide."
                invalidVersion:
                  summary: Format de version invalide
                  value:
                    success: false
                    message: "An internal error occured, please try again !"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          description: Erreur interne du serveur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerResponse"
              example:
                success: false
                message: "An internal error occured, please try again !"
    # --- DASHBOARD ---
    /dashboard/change-username/{id}:
      put:
        summary: Change le nom d’utilisateur
        tags: [Dashboard]
        parameters:
          - in: path
            name: id
            required: true
            schema:
              type: string
              format: uuid
            description: Identifiant unique de l'utilisateur (peut être un JWT pour l'utilisateur courant)
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                    minLength: 3
                    maxLength: 30
                    description: Le nouveau nom d'utilisateur
                    example: newUsername
                required:
                  - username
        responses:
          "200":
            description: Succès
          "401":
            $ref: "#/components/responses/UnauthorizedError"

  /dashboard/pages_number:
    get:
      summary: Récupère le nombre de pages du dashboard selon les paramètres
      tags: [Dashboard]
      responses:
        "200":
          description: Succès
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /dashboard/{page}:
    get:
      summary: Récupère la page du dashboard spécifiée selon les paramètres
      tags: [Dashboard]
      parameters:
        - in: path
          name: page
          required: true
          schema:
            type: string
          description: Numéro ou identifiant de la page aimée
      responses:
        "200":
          description: Succès
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # --- SOCIAL ---
  /social/comment/{snippet_id}:
    post:
      summary: Publie un commentaire sur un snippet
      tags: [Social]
      parameters:
        - in: path
          name: snippet_id
          required: true
          schema:
            type: string
            format: uuid
          description: Identifiant unique du snippet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  description: Le contenu du commentaire
                  example: "Ceci est un commentaire intéressant !"
              required:
                - comment
      responses:
        "200":
          description: Succès
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /social/like/{snippet_id}:
    get:
      summary: Aime un snippet
      tags: [Social]
      parameters:
        - in: path
          name: snippet_id
          required: true
          schema:
            type: string
            format: uuid
          description: Identifiant unique du snippet à aimer
      responses:
        "200":
          description: Succès
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /social/unlike/{snippet_id}:
    get:
      summary: Retire un like d’un snippet
      tags: [Social]
      parameters:
        - in: path
          name: snippet_id
          required: true
          schema:
            type: string
            format: uuid
          description: Identifiant unique du snippet à "unliker"
      responses:
        "200":
          description: Succès
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # --- SNIPPET ---
  /snippet/new:
    post:
      summary: Crée un nouveau snippet
      tags: [Snippet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Titre du snippet
                  example: Mon super snippet
                code:
                  type: string
                  description: Le code du snippet
                  example: console.log("Hello World");
                language:
                  type: string
                  description: Langage du code
                  example: javascript
              required:
                - title
                - code
                - language
      responses:
        "200":
          description: Succès
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /snippet/{id}:
    put:
      summary: Met à jour un snippet existant
      tags: [Snippet]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Identifiant unique du snippet à mettre à jour
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Nouveau titre du snippet
                  example: Mon snippet mis à jour
                code:
                  type: string
                  description: Nouveau code du snippet
                  example: console.log("Updated Hello World");
                language:
                  type: string
                  description: Nouveau langage du code
                  example: javascript
      responses:
        "200":
          description: Succès
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /snippet/unref/{path}:
    get:
      summary: Supprime la référence d’un snippet
      tags: [Snippet]
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
            format: uuid # Assumant que 'path' est un UUID pour l'exemple
          description: Identifiant unique ou chemin du snippet à déréférencer
      responses:
        "200":
          description: Succès
        "401":
          $ref: "#/components/responses/UnauthorizedError"

components:
  schemas:
    UnauthorizedResponse:
      type: object
      properties:
        message:
          type: string
          example: "Cannot access to this feature yet, try to anthenticate !"
        success:
          type: boolean
          example: false
        redirect:
          type: string
          example: "/login"
  responses:
    UnauthorizedError:
      description: Non autorisé
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedResponse"
