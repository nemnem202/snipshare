services:
  db:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}

  backend:
    image: snipshare-backend:prod
    build:
      context: ./backend
      dockerfile: dockerfile.prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${BACKEND_PORT}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - JWT_SECRET=${BACKEND_JWT_SECRET}
      - JWT_RT_TTL=${BACKEND_JWT_RT_TTL}
    ports:
      - ${BACKEND_PORT}:3000
    depends_on:
      - db

  frontend:
    image: snipshare-frontend:prod
    restart: always
    build:
      context: ./frontend
      dockerfile: dockerfile.prod
      args:
        VITE_API_URL: ${FRONTEND_VITE_API_URL}
    environment:
      - VITE_API_URL=${FRONTEND_VITE_API_URL}
    ports:
      - ${FRONTEND_PORT}:5000
