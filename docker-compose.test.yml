services:
  db:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}

  backend:
    volumes:
      - ./backend:/app
      - /app/node_modules
    build:
      context: ./backend
      dockerfile: dockerfile.test
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${BACKEND_PORT}
      - JWT_SECRET=${BACKEND_JWT_SECRET}
      - JWT_RT_TTL=${BACKEND_JWT_RT_TTL}
      - CORS_ALLOWED=${BACKEND_CORS_ALLOWED}
    ports:
      - ${BACKEND_PORT}:3000
    depends_on:
      - db
